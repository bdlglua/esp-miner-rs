[package]
name = "esp-miner-rs"
version = "0.1.0"
authors = ["Georges Palauqui <g.palauqui@gptechinno.com>"]
edition = "2021"
description = "Rust based firmware for Bitaxe Max, Ultra and Gamma"
repository = "https://github.com/bitaxeorg/esp-miner-rs"
license = "MIT OR Apache-2.0"

keywords = ["embedded", "embedded-hal", "esp", "esp32s3", "no-std"]
categories = ["embedded", "no-std", "bitcoin"]

[dependencies]
axeos-core = { path = "../axeos-core" }
serde = { version = "1", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
esp-storage = { version = "0.10.0", features = ["esp32s3", "bytewise-read"] }
# Use the supplied bm13xx-rs snapshot, including the BM1370 driver.
bm1366 = { path = "../vendor/bm13xx-rs/bm1366", features = ["defmt"], optional = true }
bm1370 = { path = "../vendor/bm13xx-rs/bm1370", features = ["defmt"], optional = true }
bm1397 = { path = "../vendor/bm13xx-rs/bm1397", features = ["defmt"], optional = true }
bm13xx-chain = { path = "../vendor/bm13xx-rs/bm13xx-chain", features = ["defmt"] }
bm13xx-protocol = { path = "../vendor/bm13xx-rs/bm13xx-protocol", features = ["defmt"] }
gamma-power = { path = "../gamma-power", optional = true }
bounded-integer = "0.6"
defmt = "1.2.0"
defmt-rtt = "1.3.1"
ds4432 = { version = "0.3.0", default-features = false, features = [
    "async",
    "core-error",
    "defmt",
] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-net = { version = "0.9.1", features = [
    "defmt",
    "dhcpv4",
    "dhcpv4-hostname",
    "dns",
    "medium-ethernet",
    "tcp",
    "udp",
] }
embassy-sync = "0.8.0"
embassy-time = { version = "0.5.1", features = ["defmt"] }
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", features = ["defmt-03"] }
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
# stratum-v1 0.1 still uses the embedded-io 0.6 traits, see src/io06.rs
embedded-io-06 = { package = "embedded-io", version = "0.6.1" }
embedded-io-async-06 = { package = "embedded-io-async", version = "0.6.1" }
emc2101 = { version = "4.0.0", default-features = false, features = [
    "async",
    "defmt",
] }
esp-alloc = { version = "0.11.0", features = ["defmt", "esp32s3"] }
esp-backtrace = { version = "0.20.0", features = [
    "defmt",
    "esp32s3",
    "panic-handler",
] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["defmt", "esp32s3"] }
esp-hal = { version = "1.2.2", features = ["defmt", "esp32s3", "unstable"] }
esp-radio = { version = "1.0.0-beta.1", features = [
    "defmt",
    "esp-alloc",
    "esp32s3",
    "unstable",
    "wifi",
] }
esp-rtos = { version = "0.4.0", features = [
    "defmt",
    "embassy",
    "esp-alloc",
    "esp-radio",
    "esp32s3",
] }
fugit = "0.6.0"
# kept on 0.8: stratum-v1 0.1 API uses heapless 0.8 types
heapless = { version = "0.8.0", default-features = false, features = [
    "defmt-03",
] }
ina260 = { version = "0.4.0", features = [
    "defmt-03",
], git = "https://github.com/korbin/ina260.git" }
miner-core = { path = "../miner-core", features = ["defmt"] }
smoltcp = { version = "0.13.0", default-features = false, features = [
    "medium-ethernet",
    "proto-dhcpv4",
    "proto-ipv4",
    "socket-dhcpv4",
    "socket-icmp",
    "socket-raw",
    "socket-tcp",
    "socket-udp",
] }
static_cell = { version = "2.1.1", features = ["nightly"] }
stratum-v1 = "0.1.0"

[features]
bitaxe-max = ["dep:bm1397"]
bitaxe-ultra = ["dep:bm1366"]
bitaxe-gamma = ["dep:bm1370", "dep:gamma-power"]

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1       # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = true
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
