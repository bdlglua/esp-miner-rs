[package]
name = "axeos-web"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde_json = "1"
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Node", "NodeList", "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Event", "EventTarget", "Request", "RequestInit", "RequestMode", "Headers", "Response", "Location", "Storage", "console"] }

[dev-dependencies]
axeos-core = { path = "../axeos-core" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
